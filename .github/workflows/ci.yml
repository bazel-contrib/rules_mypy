name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        folder: [".", "examples/demo", "examples/opt-in"]
        version: ["7.x", "8x"]
        os: ["ubuntu-latest"]
        include:
          # Since examples are not fully compatible with bazel 9 yet
          # (due to usage of global py_* rules), only test root project for now
          # with this version.
          - folder: "."
            version: "9.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          repository-cache: true
          bazelrc: common --announce_rc --color=yes --enable_workspace=false
      - name: Configure Bazel version
        working-directory: ${{ matrix.folder }}
        run: |
          echo "${{ matrix.version }}" > .bazelversion
          bazel version
      - name: Build
        working-directory: ${{ matrix.folder }}
        run: bazel build ...
      - name: Test
        working-directory: ${{ matrix.folder }}
        run: bazel test ...
